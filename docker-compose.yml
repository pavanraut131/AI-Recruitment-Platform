

# ─── Database roles (EPIC-02 spec §6.2, §7.2; docs/runbooks/tenancy-rls.md) ─────
# POSTGRES_USER is the bootstrap superuser, for administration only. The init script
# (docker/postgres/init/10-roles.sh, on a new volume; `make db-roles` on an existing one)
# creates hireflow_owner (owns the schema: migrations and operator commands) and hireflow_app
# (the API and the workers, under row-level security). The backend services get their URLs
# from these values below, so a .env only needs the POSTGRES_* values (and, optionally, other
# passwords); `environment` overrides any DATABASE_URL / SYNC_DATABASE_URL left in .env.
x-database-urls: &database-urls
  DATABASE_URL: postgresql+asyncpg://hireflow_app:${HIREFLOW_APP_PASSWORD:-hireflow_app_secret}@postgres:5432/${POSTGRES_DB:-resumeai}
  SYNC_DATABASE_URL: postgresql://hireflow_app:${HIREFLOW_APP_PASSWORD:-hireflow_app_secret}@postgres:5432/${POSTGRES_DB:-resumeai}
  MIGRATION_DATABASE_URL: postgresql://hireflow_owner:${HIREFLOW_OWNER_PASSWORD:-hireflow_owner_secret}@postgres:5432/${POSTGRES_DB:-resumeai}

# ─── Email (EPIC-02 spec §4.4; E2-07) ────────────────────────
# Mailpit catches every email the stack sends (invitations, password resets): read them at
# http://localhost:8025 (MAILPIT_UI_HOST_PORT). The API renders the messages (links to
# FRONTEND_URL) and the worker_default service sends them. The defaults keep a .env written
# before E2-07 working without an edit.
x-email: &email
  EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

services:
  # ─── Infrastructure ───────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resumeai_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resumeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resumeai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-resumeai}
      # Read by docker/postgres/init/10-roles.sh (a new volume, or `make db-roles`).
      HIREFLOW_OWNER_PASSWORD: ${HIREFLOW_OWNER_PASSWORD:-hireflow_owner_secret}
      HIREFLOW_APP_PASSWORD: ${HIREFLOW_APP_PASSWORD:-hireflow_app_secret}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/hireflow:ro
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resumeai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resumeai_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Catches outgoing email (E2-07): web UI and HTTP API on MAILPIT_UI_HOST_PORT, SMTP on 1025 for
  # the containers (and on MAILPIT_SMTP_HOST_PORT for a backend run on the host). Messages are
  # kept in memory: recreating the container empties it.
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: resumeai_mailpit
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: resumeai_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumeai_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      <<: [*database-urls, *email]
      # /api/v2 requires a session from E2-05, but the frontend has no login screen until
      # E2-09: a local .env without the setting keeps the stack usable (no session = the default
      # agency's owner). Set AUTH_REQUIRED=true in .env to try sign-in for real. Development
      # only: the app refuses false outside APP_ENV=development/test.
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Celery Workers ───────────────────────────────────────────
  worker_extract:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumeai_worker_extract
    command: celery -A app.platform.celery_app worker -Q extract_queue --concurrency=4 --loglevel=info -n extract@%h
    env_file: .env
    environment: *database-urls
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker_ai:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumeai_worker_ai
    command: celery -A app.platform.celery_app worker -Q ai_queue --concurrency=2 --loglevel=info -n ai@%h
    env_file: .env
    environment: *database-urls
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # identity's tasks (E2-07): sending email and the daily purge, on the queue "default".
  worker_default:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumeai_worker_default
    command: celery -A app.platform.celery_app worker -Q default --concurrency=2 --loglevel=info -n default@%h
    env_file: .env
    environment:
      <<: [*database-urls, *email]
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Periodic tasks (E2-07: identity.purge_expired, daily); worker_default runs them.
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumeai_beat
    command: celery -A app.platform.celery_app beat --loglevel=info
    env_file: .env
    environment: *database-urls
    volumes:
      - ./backend:/app
    depends_on:
      - redis

  # ─── Flower (Celery Monitoring) ───────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumeai_flower
    command: celery -A app.platform.celery_app flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    env_file: .env
    environment: *database-urls
    ports:
      - "${FLOWER_HOST_PORT:-5555}:5555"
    depends_on:
      - redis

  # ─── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resumeai_frontend
    env_file: .env
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
