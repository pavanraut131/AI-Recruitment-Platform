[project]
name = "resumeai-backend"
version = "0.1.0"
description = "AI Recruitment Platform backend: FastAPI API, Celery workers, Alembic migrations."
requires-python = ">=3.11,<3.12"
dependencies = [
    # Web
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "python-multipart==0.0.9",
    # Database
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    # Settings
    "pydantic-settings==2.3.0",
    "pydantic==2.7.3",
    # Celery (flower is used by the flower container)
    "celery[redis]==5.4.0",
    "redis==5.0.5",  # redis 5 has no "asyncio" extra; redis.asyncio is built in
    "flower==2.0.1",
    # PDF processing
    "pdfplumber==0.11.1",
    "pymupdf==1.24.5",
    "Pillow==10.3.0",
    # AI
    "google-generativeai==0.7.2",
    # Object storage (MinIO / S3 compatible)
    "boto3==1.34.131",
    "botocore==1.34.131",
    # SSE
    "sse-starlette==2.1.0",
    # Logging
    "structlog==24.2.0",
    # Rate limiting
    "slowapi==0.1.9",
    # Utilities
    "aiofiles==23.2.1",
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "tenacity==8.3.0",
]

[dependency-groups]
dev = [
    # Test
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==7.1.0",
    "aiosqlite==0.20.0",
    # Lint / format / type check
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    # Type stubs for mypy
    "celery-types==0.26.0",
    "boto3-stubs[s3]==1.34.131",
]

[tool.uv]
# Application, not a library: don't build/install the project itself.
package = false

# ── pytest ───────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ── ruff ─────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = [
    # Line length is owned by `ruff format`; what it can't wrap (long string literals such as
    # LLM prompts, Alembic-generated lines) isn't worth hand-breaking.
    "E501",
    # `class X(str, Enum)` -> `StrEnum` changes str()/format() output of members (used in DB
    # values and JSON); not a safe mechanical change.
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "workers"]
# The local `alembic/` migrations folder would otherwise make ruff treat the library as first-party.
known-third-party = ["alembic"]

# ── mypy ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["app", "workers"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Third-party libraries that ship no type information and have no stub package.
# ("google" is the namespace package of google.generativeai; without it mypy reports it on
# incremental runs with a warm cache.)
[[tool.mypy.overrides]]
module = ["fitz", "google", "google.generativeai"]
ignore_missing_imports = true

# BASELINE: modules that had type errors when mypy was introduced (E0-02).
# Remove entries as modules are fixed; never add new ones.
[[tool.mypy.overrides]]
module = [
    "app.api.v1.resumes",    # Celery apply_async(args=list) and Optional filename
    "app.core.database",     # get_db async generator annotated with the wrong return type
    "workers.ai_task",       # implicit Optional default; unchecked Optional ORM rows
    "workers.extract_task",  # implicit Optional default; unchecked Optional ORM rows; apply_async args
]
ignore_errors = true
