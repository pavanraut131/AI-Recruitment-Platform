[project]
name = "resumeai-backend"
version = "0.1.0"
description = "AI Recruitment Platform backend: FastAPI API, Celery workers, Alembic migrations."
requires-python = ">=3.11,<3.12"
dependencies = [
    # Web
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "python-multipart==0.0.9",
    # Database
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    # Settings
    "pydantic-settings==2.3.0",
    "pydantic==2.7.3",
    # Celery (flower is used by the flower container)
    "celery[redis]==5.4.0",
    "redis==5.0.5",  # redis 5 has no "asyncio" extra; redis.asyncio is built in
    "flower==2.0.1",
    # PDF processing
    "pdfplumber==0.11.1",
    "pymupdf==1.24.5",
    "Pillow==10.3.0",
    # AI
    "google-generativeai==0.7.2",
    # Object storage (MinIO / S3 compatible)
    "boto3==1.34.131",
    "botocore==1.34.131",
    # SSE
    "sse-starlette==2.1.0",
    # Logging
    "structlog==24.2.0",
    # Rate limiting
    "slowapi==0.1.9",
    # Utilities
    "aiofiles==23.2.1",
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "tenacity==8.3.0",
    # Seed data for local stacks (app.devtools.seed runs inside the backend image)
    "faker==30.8.2",
    # Identity normalisation (phone numbers -> E.164)
    "phonenumbers==9.0.41",
]

[dependency-groups]
dev = [
    # Test
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==7.1.0",
    "syrupy==6.1.1",  # snapshot tests (tests/characterization)
    "hypothesis==6.169.0",  # property-based tests (tests/unit)
    "fakeredis==2.39.0",  # in-memory Redis for the SSE stream and /health/ready
    # Real Postgres (pgvector/pgvector:pg16) in Docker for the test session
    "testcontainers[postgres]==4.15.0",
    # Lint / format / type check
    "ruff==0.17.0",
    "mypy==2.4.0",
    "import-linter==2.15",  # module boundaries (spec EPIC-00 §3), run as `lint-imports`
    "pre-commit==4.7.0",
    # Type stubs for mypy
    "celery-types==0.26.0",
    "boto3-stubs[s3]==1.34.131",
]

[tool.uv]
# Application, not a library: don't build/install the project itself.
package = false

# ── pytest ───────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage is reported on every run; no fail-under gate until app/modules/ exists (Sprint 2).
addopts = "--cov=app --cov=workers --cov-report=term-missing"

# ── coverage (pytest-cov) ────────────────────────────────────
[tool.coverage.run]
# SQLAlchemy's asyncio layer runs ORM code inside greenlets; without this, lines after an
# `await session...` call are reported as not covered.
concurrency = ["thread", "greenlet"]

# ── ruff ─────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = [
    # Line length is owned by `ruff format`; what it can't wrap (long string literals such as
    # LLM prompts, Alembic-generated lines) isn't worth hand-breaking.
    "E501",
    # `class X(str, Enum)` -> `StrEnum` changes str()/format() output of members (used in DB
    # values and JSON); not a safe mechanical change.
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "workers"]
# The local `alembic/` migrations folder would otherwise make ruff treat the library as first-party.
known-third-party = ["alembic"]

# ── import-linter ────────────────────────────────────────────
# Module boundaries from spec EPIC-00 §3 / ADR 0001. Run with `uv run lint-imports`.
# Module expressions that match nothing (e.g. a module with no service.py yet) are not errors, so
# these contracts start biting as soon as the files they describe exist.
[tool.importlinter]
root_packages = ["app", "workers"]
# Third-party packages are nodes in the import graph too, so a contract can forbid one
# (``google`` below). Only their top-level name is modelled, e.g. ``google``.
include_external_packages = true
# `if TYPE_CHECKING:` imports count (grimp's default; `exclude_type_checking_imports` is deliberately
# left off): a type-only import of another module's models is still coupling to its internals. So
# cross-module ORM relationships name their target by string, and once both ends are in modules they
# must not import each other even for typing (see app/modules/hiring/models.py, E0-09/E0-10).

[[tool.importlinter.contracts]]
id = "module-layers"
name = "Module layers: ingestion -> hiring -> talent"
type = "layers"
containers = ["app.modules"]
layers = ["ingestion", "hiring", "talent"]

[[tool.importlinter.contracts]]
id = "leaf-modules"
name = "talent and ai import no other module"
type = "forbidden"
source_modules = ["app.modules.talent", "app.modules.ai"]
# A module importing itself is not a violation (import-linter skips overlapping pairs).
forbidden_modules = ["app.modules.*"]

[[tool.importlinter.contracts]]
id = "platform-independent"
name = "platform does not import modules"
type = "forbidden"
source_modules = ["app.platform"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
id = "devtools-unimported"
name = "Nothing imports devtools"
type = "protected"
protected_modules = ["app.devtools"]
allowed_importers = ["app.devtools"]

[[tool.importlinter.contracts]]
id = "llm-sdk-only-in-ai"
name = "Only the ai module imports an LLM SDK (google.*)"
type = "forbidden"
# Everything except app.modules.ai. (A forbidden contract takes no "all but" wildcard, so list
# the rest; a new top-level package under app/ must be added here.)
source_modules = [
    "app.main",
    "app.platform",
    "app.devtools",
    "app.modules.hiring",
    "app.modules.ingestion",
    "app.modules.talent",
    "workers",
]
forbidden_modules = ["google"]
# Importing ai.service (which may load the Gemini adapter) is the point; only direct imports of
# google.* outside ai are violations.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "public-interfaces"
name = "Modules import only each other's service and schemas"
type = "forbidden"
source_modules = ["app.modules.*"]
# Every module is forbidden to every other module (a module's own internals are skipped as an
# overlapping pair) ...
forbidden_modules = ["app.modules.*"]
# ... except for these two public submodules. Ignored imports are dropped from this contract's
# copy of the graph, so a chain through another module's service (service -> its own models)
# isn't reported as an indirect import either.
ignore_imports = [
    "app.modules.** -> app.modules.*.service",
    "app.modules.** -> app.modules.*.schemas",
]
# The allowlist above matches nothing until the first cross-module import exists.
unmatched_ignore_imports_alerting = "none"
broken_contract_guidance = "Import another module only through its public interface: app.modules.<name>.service, or the schemas it exposes in app.modules.<name>.schemas. Never its models, repository, router, tasks or other internals."

# ── mypy ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["app", "workers"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Third-party libraries that ship no type information and have no stub package.
# ("google" is the namespace package of google.generativeai; without it mypy reports it on
# incremental runs with a warm cache.)
[[tool.mypy.overrides]]
module = ["fitz", "google", "google.generativeai"]
ignore_missing_imports = true

# STRICT: the modular-monolith code (spec EPIC-00 §3) is held to `mypy --strict` from the start.
# `strict = true` is a global-only option (in an override it switches strict on everywhere), so
# these are the per-module flags `--strict` enables (warn_redundant_casts is already global).
[[tool.mypy.overrides]]
module = ["app.modules", "app.modules.*", "app.platform", "app.platform.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

# BASELINE: modules that had type errors when mypy was introduced (E0-02).
# Remove entries as modules are fixed; never add new ones.
[[tool.mypy.overrides]]
module = [
    "app.api.v1.resumes",    # Celery apply_async(args=list) and Optional filename
    "workers.ai_task",       # implicit Optional default; unchecked Optional ORM rows
    "workers.extract_task",  # implicit Optional default; unchecked Optional ORM rows; apply_async args
]
ignore_errors = true
