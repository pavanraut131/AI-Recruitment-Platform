name: CI

on:
  push:
    branches: [master]
  # Every PR, whatever its base: PRs are often stacked on other feature branches.
  pull_request:

# One run per branch/PR; a new push cancels the run it makes outdated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Job ids are the required status checks for branch protection (see CONTRIBUTING.md).
# Renaming one means updating the branch protection rule too.
jobs:
  backend-quality:
    name: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag, so pin the exact release.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.23" # keep in sync with backend/Dockerfile and .pre-commit-config.yaml
          python-version: "3.11"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

      # Module boundaries (spec EPIC-00 §3); contracts live in backend/pyproject.toml.
      - name: import-linter
        run: uv run lint-imports

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.11"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      # No service containers: the test session starts its own pgvector Postgres through
      # testcontainers (the runner has Docker) and sets the env vars the app needs.
      # --cov-report=xml adds coverage.xml on top of the terminal report from addopts.
      - name: pytest
        run: uv run pytest --cov-report=xml

      # Coverage gate (spec EPIC-00 §8): the modules, not the whole app, must stay >= 80 %.
      # Reads the .coverage data file pytest just wrote; keep in sync with `make coverage`.
      - name: Coverage gate (app/modules >= 80 %)
        run: uv run coverage report --include='app/modules/*' --skip-covered --fail-under=80

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: backend/coverage.xml
          if-no-files-found: error

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The roles of row-level security (EPIC-02 spec §7.2): `ci` is the bootstrap superuser
      # (it only runs docker/postgres/roles.sql); Alembic runs as hireflow_owner
      # (MIGRATION_DATABASE_URL), and Settings requires the app role's URLs at import time.
      DATABASE_URL: postgresql+asyncpg://hireflow_app:ci_app@localhost:5432/ci
      SYNC_DATABASE_URL: postgresql://hireflow_app:ci_app@localhost:5432/ci
      MIGRATION_DATABASE_URL: postgresql://hireflow_owner:ci_owner@localhost:5432/ci
      # Migrations never call an AI provider. With the fake one Settings needs no GEMINI_API_KEY
      # (the default, gemini, would refuse to load without one).
      AI_PROVIDER: fake
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.11"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      # The same SQL as the Compose init script and `make db-roles`, run by psql inside the
      # service container as its superuser.
      - name: Create the database roles
        working-directory: .
        run: >-
          docker exec -i ${{ job.services.postgres.id }}
          psql --no-psqlrc --quiet -v ON_ERROR_STOP=1 -U ci -d ci
          -v owner_password=ci_owner -v app_password=ci_app -f -
          < docker/postgres/roles.sql

      - name: Apply all migrations to an empty database
        run: uv run alembic upgrade head

      # Row-level security on every tenant table, the grants and the roles (spec §11.2).
      - name: Check the row-level-security catalogue
        run: uv run python -m app.devtools.check_rls

      # The RLS migration is reversible: down to the contract, up again, still correct.
      - name: Downgrade and upgrade the row-level-security migration
        run: |
          uv run alembic downgrade e2b02c7a4d19
          uv run alembic upgrade head
          uv run python -m app.devtools.check_rls

      # Fails if the models have changes that no migration captures.
      - name: Check models and migrations agree
        run: uv run alembic check

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Same major as the frontend Docker image (node:22-alpine); package.json engines >= 22.22.2.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Contract-first API client (ADR 0006): regenerate the /api/v2 OpenAPI document and the
      # TypeScript types from the backend, and fail if they differ from what is committed. The
      # export needs only the backend's runtime dependencies (no database, Redis or AI key).
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.23" # keep in sync with the backend jobs
          python-version: "3.11"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Export the /api/v2 OpenAPI document
        working-directory: backend
        run: uv run --frozen --no-dev python -m app.devtools.export_openapi

      - name: Generate the API client types
        run: npm run api:generate

      - name: API client drift check
        run: |
          if ! git diff --exit-code -- src/lib/api/; then
            echo "::error title=API client out of date::The /api/v2 contract changed. Run 'make api-client' and commit src/lib/api/openapi.v2.json and src/lib/api/schema.d.ts."
            exit 1
          fi

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm test

      - name: Design-token contrast (WCAG AA, light and dark)
        run: npm run check:contrast

      - name: Build
        run: npm run build

  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Services read .env via env_file, so validate against the documented template.
      - name: Generate .env from the template
        run: cp .env.example .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      # The E2E project (docker-compose.e2e.yml over docker-compose.yml), as scripts/e2e.sh runs it.
      - name: Validate the E2E override
        run: docker compose -p hireflow-e2e --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml config --quiet

  # The hero flow in Playwright against the Compose stack with the fake AI provider, with axe on
  # every page (EPIC-01 §9). scripts/e2e.sh is the same script `make e2e` runs locally. Not yet a
  # required check (CONTRIBUTING.md): it becomes one once it has been green on master.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_FRONTEND_PORT: 13000
      E2E_BACKEND_PORT: 18000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Chromium's headless shell and its system libraries. Not cached: Playwright advises
      # against it (restoring takes about as long as downloading, and the apt packages can't be).
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps --only-shell chromium

      # Builds the images, starts the services with `--wait` (health checks), migrates and seeds.
      # Configured from .env.example with AI_PROVIDER=fake: no secrets needed.
      - name: Start the E2E stack
        run: scripts/e2e.sh up

      # CI=true: one retry, the `github` reporter (annotations) and the HTML report.
      - name: Playwright
        run: scripts/e2e.sh test

      - name: Stack logs
        if: ${{ failure() }}
        run: mkdir -p frontend/e2e-results && scripts/e2e.sh logs > frontend/e2e-results/compose.log 2>&1

      - name: Upload screenshots (light and dark)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: frontend/e2e-results/screenshots
          if-no-files-found: warn

      - name: Upload the Playwright report, traces and stack logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/e2e-results/report
            frontend/e2e-results/artifacts
            frontend/e2e-results/compose.log
          if-no-files-found: ignore

      - name: Tear down
        if: ${{ always() }}
        run: scripts/e2e.sh down
